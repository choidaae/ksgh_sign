  <style>
    :root {

    * { box-sizing: border-box; }

      background: #fff;
      color: var(--text);
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
    }
    select:focus { outline: none; border-color: var(--primary); }

    .canvas-box {
      position: relative;
      margin-top: 4px;
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fbfbfc;
      transition: border-color 0.15s ease;
    }
    .canvas-box.active {
      border: 1.5px solid var(--primary);
      background: #fff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 190px;
      touch-action: auto;
      background: transparent;
    }
    .placeholder {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b7bcc6;
      font-size: 14px;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .placeholder.hidden { opacity: 0; }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      font-size: 15px;
      font-weight: 600;
      padding: 13px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.05s ease, opacity 0.15s ease;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: default; transform: none; }
    .btn-row button { flex: 1; }
    .secondary {
      background: #f1f3f6;
      color: var(--text);
      border: 1.5px solid var(--border);
    }
    .primary {
      width: 100%;
      margin-top: 14px;
      background: var(--primary);
      color: #fff;
      padding: 15px;
      font-size: 16px;
    }
    .primary:active:not(:disabled) { background: var(--primary-dark); }

    .status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      text-align: center;
      display: none;
    }
    .status.show { display: block; }
    .status.info { background: #eef2f7; color: var(--muted); }
    .status.success { background: var(--success-bg); color: var(--success-text); font-weight: 600; }
    .status.error { background: var(--error-bg); color: var(--error-text); }

<body>
  <div class="wrap">
    <header class="topbar"><span class="brand"><b>✓</b> 군산여자고등학교 · 연수 서명</span><a href="admin.html">등록부 관리 ↗</a></header>

    <main class="content">
    <div class="card">
      <div class="field">
        <label for="trainingSelect">연수 선택</label>
        <select id="trainingSelect"><option value="">불러오는 중...</option></select>
      </div>

      <div class="field">
        <label for="deptSelect">소속 선택</label>
        <select id="deptSelect"><option value="">연수를 먼저 선택하세요</option></select>
      </div>
      <div class="field">
        <label for="nameSelect">이름 선택</label>
        <select id="nameSelect"><option value="">연수를 먼저 선택하세요</option></select>
      </div>
      </div>
      <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
    </div>

    <div class="card sign-card">
      <div class="sign-head">
        <label for="pad">서명</label>
        <div class="btn-row">
          <button class="secondary" onclick="loadPrevious()">이전 서명 불러오기</button>
          <button class="secondary" onclick="clearPad()">지우기</button>
        </div>
      </div>
      <div class="canvas-box" id="canvasBox">
        <canvas aria-label="한 번 눌렀다 떼어 활성화한 뒤 서명하는 영역" id="pad" width="440" height="190"></canvas>
        <div class="placeholder" id="placeholder">한 번 눌렀다 떼면 서명할 수 있어요</div>
        <div class="status" id="status" role="status" aria-live="polite"></div>

    <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    const canvas = document.getElementById('pad');
    const ctx = canvas.getContext('2d');
    const placeholder = document.getElementById('placeholder');
    let drawing = false, lastX = 0, lastY = 0, hasStroke = false, signActive = false;
    let padScale = 1; // 서명란의 CSS 크기와 실제 그림 크기의 비율
    const canvasBox = document.getElementById('canvasBox');

    let statusTimer = null;
    function setStatus(text, type, autoHideMs) {
      const el = document.getElementById('status');
      if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
      el.textContent = text || '';
      el.className = 'status' + (text ? ' show' : '') + (type ? ' ' + type : '');
      canvasBox.classList.toggle('has-status', !!text);
      // 확인만 하면 되는 안내는 잠시 뒤 스스로 사라집니다.
      if (text && autoHideMs) statusTimer = setTimeout(function () { setStatus(''); }, autoHideMs);
    }

    // 연수·소속·이름 선택란 한가운데 뜨는 안내. 불러오는 동안에만 보여줍니다.
    function setFormStatus(text) {
      const el = document.getElementById('formStatus');
      el.textContent = text || '';
      el.className = 'form-status' + (text ? ' show' : '');
    }

    function scalePoint(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      return { x: cx * canvas.width / rect.width, y: cy * canvas.height / rect.height };
    }
    let submitting = false, loadingPrevious = false, loadingData = false, requestVersion = 0;
    const ACTIVATE_TAP_DISTANCE = 10; // CSS 픽셀: 움직임이 크면 스크롤/드래그로 간주
    const ACTIVATE_TAP_DURATION = 600; // 밀리초: 길게 누르기는 활성화하지 않음
    let activationTap = null, drawingPointer = null;

    // 아직 고르지 않은 항목이 있으면 그 안내를 돌려줍니다.
    function selectionHint() {
      if (!document.getElementById('trainingSelect').value) return '연수를 먼저 선택하세요';
      if (!document.getElementById('nameSelect').selectedOptions[0]?.dataset.row) return '이름을 먼저 선택하세요';
      return '';
    }
    function canSign() {
      return !submitting && !loadingPrevious && !loadingData &&
        !!document.getElementById('nameSelect').selectedOptions[0]?.dataset.row;
    }
    function start(e) {
      if (e.isPrimary === false) { activationTap = null; return; }
      if (e.button !== 0 || drawingPointer !== null) return;
      if (!canSign()) {
        // 연수나 이름을 고르지 않은 채 서명란을 누르면 잠시 안내만 띄웁니다.
        if (!submitting && !loadingPrevious && !loadingData) {
          const hint = selectionHint();
          if (hint) setStatus(hint, 'info', 2000);
        }
        return;
      }
      if (!signActive) {
        // 첫 터치는 눌렀다 뗀 뒤에만 판정합니다. 스크롤을 막거나 선을 그리지 않습니다.
        activationTap = {id: e.pointerId, x: e.clientX, y: e.clientY, time: e.timeStamp, moved: false};
        return;
      }
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      drawingPointer = e.pointerId;
      drawing = true;
      const p = scalePoint(e);
      lastX = p.x; lastY = p.y;
      ctx.beginPath(); ctx.fillStyle = '#29283d'; ctx.arc(p.x,p.y,1.25*padScale,0,Math.PI*2); ctx.fill();
      if (!hasStroke) { hasStroke = true; placeholder.classList.add('hidden'); }
    }
    function move(e) {
      if (activationTap && activationTap.id === e.pointerId) {
        if (Math.hypot(e.clientX - activationTap.x, e.clientY - activationTap.y) > ACTIVATE_TAP_DISTANCE) {
          activationTap.moved = true;
        }
        return;
      }
      if (!drawing || drawingPointer !== e.pointerId) return;
      const p = scalePoint(e);
      ctx.lineWidth = 2.5 * padScale; ctx.lineCap = 'round'; ctx.strokeStyle = '#1f2430';
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastX = p.x; lastY = p.y;
      e.preventDefault();
    }
    function stopDrawing() {
      const pointer = drawingPointer;
      drawing = false;
      drawingPointer = null;
      if (pointer !== null && canvas.hasPointerCapture(pointer)) canvas.releasePointerCapture(pointer);
    }
    function end(e) {
      if (drawingPointer === e.pointerId) { stopDrawing(); return; }
      if (!activationTap || activationTap.id !== e.pointerId) return;
      const tap = activationTap;
      activationTap = null;
      const rect = canvas.getBoundingClientRect();
      const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (!canSign() || tap.moved || !inside || e.timeStamp - tap.time > ACTIVATE_TAP_DURATION ||
          Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > ACTIVATE_TAP_DISTANCE) return;
      signActive = true;
      canvasBox.classList.add('active');
      canvas.style.touchAction = 'none'; // 스타일시트 규칙에 기대지 않고 직접 지정
      lockPageScroll();
      if (!hasStroke) {
        placeholder.textContent = '이제 손가락이나 펜으로 서명해 주세요';
        placeholder.classList.remove('hidden');
      }
      // 활성화한 첫 터치에서는 점/선을 추가하지 않습니다.
    }
    function cancelPointer(e) {
      if (activationTap && activationTap.id === e.pointerId) activationTap = null;
      if (drawingPointer === e.pointerId) stopDrawing();
    }
    // 활성 상태에서는 서명란 위의 화면 이동을 브라우저에 넘기지 않습니다.
    // touch-action 만으로는 브라우저가 스크롤로 판단한 뒤를 되돌리지 못해,
    // 터치 이벤트의 기본 동작을 직접 취소합니다. passive: false 여야 취소됩니다.
    // 그리는 중인지는 보지 않습니다. 활성 상태면 무조건 막습니다.
    // 활성화된 동안에는 페이지를 그 자리에 고정합니다.
    // 터치 기본 동작을 취소하는 방식은 브라우저가 이를 존중해야 통하지만,
    // 스크롤할 높이 자체가 없으면 존중 여부와 무관하게 움직이지 않습니다.
    let lockedScrollY = 0;
    function lockPageScroll() {
      if (document.body.dataset.scrollLocked === '1') return;
      lockedScrollY = window.scrollY || window.pageYOffset || 0;
      document.body.dataset.scrollLocked = '1';
      document.body.style.position = 'fixed';
      document.body.style.top = (-lockedScrollY) + 'px';
      document.body.style.left = '0';
      document.body.style.right = '0';
      document.body.style.width = '100%';
      document.body.style.overflow = 'hidden';
    }
    function unlockPageScroll() {
      if (document.body.dataset.scrollLocked !== '1') return;
      delete document.body.dataset.scrollLocked;
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      document.body.style.width = '';
      document.body.style.overflow = '';
      window.scrollTo(0, lockedScrollY);
    }

    function blockPageMove(e) {
      if (!signActive) return;                       // 비활성일 때는 평소대로 스크롤됩니다
      if (e.touches && e.touches.length > 1) return; // 두 손가락 확대는 그대로 둡니다
      if (e.cancelable) e.preventDefault();
    }
    canvas.addEventListener('touchstart', blockPageMove, { passive: false });
    canvas.addEventListener('touchmove', blockPageMove, { passive: false });

    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', cancelPointer);
    canvas.addEventListener('lostpointercapture', cancelPointer);
    canvas.addEventListener('pointerleave', function(e) {
      if (activationTap && activationTap.id === e.pointerId) activationTap = null;
    });

    function deactivate() {
      activationTap = null;
      stopDrawing();
      signActive = false;
      canvasBox.classList.remove('active');
      canvas.style.touchAction = '';
      unlockPageScroll();
      if (pendingResize) { pendingResize = false; resizeCanvas(); }
      if (!hasStroke) {
        placeholder.textContent = '한 번 눌렀다 떼면 서명할 수 있어요';
        placeholder.classList.remove('hidden');
      }
    }
    // 영역 밖을 누르거나 화면이 스크롤되면, 다음 입력은 다시 탭으로 활성화합니다.
    document.addEventListener('pointerdown', function (e) {
      if (!canvasBox.contains(e.target)) deactivate();
    });
    // 페이지를 고정·복원할 때도 스크롤 이벤트가 발생하므로, 고정 중에는 무시합니다.
    // 고정하지 않은 상태의 스크롤은 그대로 해제 신호로 씁니다.
    window.addEventListener('scroll', function () {
      if (document.body.dataset.scrollLocked !== '1') deactivate();
    }, {passive: true});
    window.addEventListener('blur', deactivate);

    // 서명란 높이는 화면 크기에 따라 달라집니다. 그리는 영역도 보이는 크기에 맞춰야
    // 서명이 위아래로 늘어나 보이지 않습니다. 크기를 바꾸면 화면이 지워지므로
    // 그려둔 서명은 옮겨 담습니다.
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const cssW = Math.round(rect.width), cssH = Math.round(rect.height);
      if (!cssW || !cssH) return;
      // 고해상도 화면에서는 그만큼 촘촘하게 그려야 선이 거칠어지지 않습니다.
      const ratio = Math.min(window.devicePixelRatio || 1, 3);
      const w = Math.round(cssW * ratio), h = Math.round(cssH * ratio);
      if (w === canvas.width && h === canvas.height) { padScale = ratio; return; }
      let kept = null;
      if (hasStroke) {
        kept = document.createElement('canvas');
        kept.width = canvas.width; kept.height = canvas.height;
        const kctx = kept.getContext('2d');
        if (kctx) kctx.drawImage(canvas, 0, 0); else kept = null;
      }
      canvas.width = w; canvas.height = h;
      padScale = ratio;
      if (kept) ctx.drawImage(kept, 0, 0, kept.width, kept.height, 0, 0, w, h);
    }
    let resizeTimer = null, pendingResize = false;
    window.addEventListener('resize', function () {
      // 서명 중에는 건드리지 않고, 서명란에서 손을 뗀 뒤로 미룹니다.
      if (signActive || drawing) { pendingResize = true; return; }
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resizeCanvas, 150);
    });

    function clearPad() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasStroke = false;
      deactivate();
    }

    let allNames = [];
    let firstLoadDone = false;
    let regDims = { rowHeight: 0, colWidths: {} };

    function requestData(method, ...args) {
      return window.callApi(method, ...args);
    }
    function setDataLoading(loading) {
      loadingData = loading;
      lockForm(loading);
    }
    function resetPeople(message) {
      allNames = [];
      regDims = { rowHeight: 0, colWidths: {} };
      document.getElementById('deptSelect').replaceChildren(new Option(message, ''));
      document.getElementById('nameSelect').replaceChildren(new Option(message, ''));
    }
    async function updateRegisterPeople(training, version) {
      resetPeople(training ? '불러오는 중...' : '연수를 먼저 선택하세요');
      if (!training) { setFormStatus(''); return; }
      setFormStatus('이름을 불러오는 중...');
      try {
        const result = await requestData('getRegisterNames', training);
        if (version !== requestVersion) return;
        allNames = result.people;
        regDims = { rowHeight: result.rowHeight, colWidths: result.colWidths };
        const deptSel = document.getElementById('deptSelect');
        deptSel.replaceChildren(new Option('전체', ''));
        const depts = [...new Set(allNames.map(n => n.dept).filter(Boolean))];
        depts.sort((a, b) => a.localeCompare(b, 'ko'));
        depts.forEach(d => deptSel.appendChild(new Option(d, d)));
        renderNames('');
      } catch (err) {
        if (version === requestVersion) resetPeople('연수를 다시 선택해 주세요');
        throw err;
      } finally {
        if (version === requestVersion) setFormStatus('');
      }
    }
    async function loadTrainingList() {
      if (submitting || loadingPrevious || loadingData) return;
      const sel = document.getElementById('trainingSelect');
      const version = ++requestVersion;
      setDataLoading(true);
      // 불러오는 중 안내는 선택란 안내창에서만 보여줍니다.
      setFormStatus('불러오는 중... 처음 접속시 로딩이 지연될 수 있습니다.');
      setStatus('');
      try {
        const list = await requestData('getTrainingList', false);
        if (version !== requestVersion) return;
        // 목록을 가져오기 전 실패하면 작성 중인 서명과 선택값을 유지합니다.
        clearPad();
        sel.replaceChildren(new Option(list.length ? '— 연수를 선택하세요 —' : '생성된 연수가 없습니다', ''));
        list.forEach(t => sel.appendChild(new Option(t, t)));
        sel.value = '';
        await updateRegisterPeople('', version);
        if (version !== requestVersion) return;
        setStatus('');
      } catch (err) {
        if (version === requestVersion) setStatus('불러오지 못했습니다. 페이지를 다시 열어 주세요. ' + err.message, 'error');
      } finally {
        if (version === requestVersion) {
          firstLoadDone = true;
          setFormStatus('');
          setDataLoading(false);
        }
      }
    }

    document.getElementById('trainingSelect').addEventListener('change', async function () {
      if (submitting || loadingPrevious || loadingData) return;
      const version = ++requestVersion;
      clearPad();
      setStatus('');
      setDataLoading(true);
      try { await updateRegisterPeople(this.value, version); }
      catch (err) { if (version === requestVersion) setStatus('오류: ' + err.message, 'error'); }
      finally { if (version === requestVersion) setDataLoading(false); }
    });

    document.getElementById('deptSelect').addEventListener('change', function () {
      ++requestVersion; clearPad(); setStatus('');
      renderNames(this.value);
    });

    document.getElementById('nameSelect').addEventListener('change', function () {
      ++requestVersion; clearPad(); setStatus('');
    });

    function renderNames(dept) {
      const nameSel = document.getElementById('nameSelect');
      nameSel.innerHTML = '';
      const filtered = dept ? allNames.filter(function (n) { return n.dept === dept; }) : allNames;
      if (!filtered.length) { nameSel.innerHTML = '<option value="">해당 소속 인원이 없습니다</option>'; return; }
      const first = document.createElement('option');
      first.value = ''; first.textContent = '— 이름을 선택하세요 —';
      nameSel.appendChild(first);
      filtered.forEach(function (n) {
        const o = document.createElement('option');
        o.value = n.name; o.textContent = n.name + (n.done ? ' (서명완료)' : '');
        o.dataset.row = n.row; o.dataset.signCol = n.signCol; o.dataset.done = n.done ? '1' : '0';
        nameSel.appendChild(o);
      });
    }

    function lockForm(lock) {
      document.querySelectorAll('select,button').forEach(el=>el.disabled=lock);
    }
    function loadPrevious() {
      if (submitting || loadingPrevious || loadingData) return;
      const name = document.getElementById('nameSelect').value;
      if (!name) { setStatus('이름을 선택해 주세요.', 'error'); return; }
      const matches = allNames.filter(n=>n.name===name);
      if(matches.length>1){setStatus('동명이인이 있어 이전 서명을 불러올 수 없습니다. 직접 서명해 주세요.','info');return;}
      const version = requestVersion;
      loadingPrevious = true;lockForm(true);
      setStatus('불러오는 중...', 'info');
      window.callApi('getPreviousSignature', name)
        .then(function (dataUrl) {
          if(version!==requestVersion){loadingPrevious=false;lockForm(false);return;}
          if (!dataUrl) { loadingPrevious=false;lockForm(false); setStatus('저장된 이전 서명이 없습니다.', 'error', 2000); return; }
          const img = new Image();
          img.onload = function () {
            loadingPrevious=false;lockForm(false);
            if(version!==requestVersion)return;
            clearPad();
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            hasStroke = true; // 불러온 서명도 수정하려면 탭으로 활성화
            placeholder.classList.add('hidden');
          };
          img.onerror = function(){loadingPrevious=false;lockForm(false);setStatus('이전 서명을 읽지 못했습니다. 직접 서명해 주세요.','error');};
          img.src = dataUrl;
          setStatus('');
        })
        .catch(function (err) { loadingPrevious=false;lockForm(false);setStatus('오류: ' + err.message, 'error'); });
    }

    // 시트는 서명을 칸 크기로 줄여서 표시합니다. 보내기 전에 미리 줄이면
    // 업로드와 시트 삽입이 빨라지고 _서명저장 시트에 쌓이는 문자열도 짧아집니다.
    // 잘라내기는 하지 않습니다. 서버가 이미지를 칸에 맞춰 늘리므로 여백을 잘라내면
    // 서명이 칸 안에서 커 보이는 등 기존과 모양이 달라집니다.
    function exportSignaturePng(cellWidth, cellHeight) {
      const full = function () { return canvas.toDataURL('image/png'); };
      if (!cellWidth || !cellHeight) return full();
      const scale = 4; // 고해상도 화면과 이전 서명 다시 불러오기를 감안한 여유
      const w = Math.round(Math.max(20, cellWidth - 6) * scale);
      const h = Math.round(Math.max(14, cellHeight - 6) * scale);
      if (!isFinite(w) || !isFinite(h) || w >= canvas.width) return full();
      const out = document.createElement('canvas');
      out.width = w; out.height = h;
      const octx = out.getContext('2d');
      if (!octx) return full();
      octx.imageSmoothingEnabled = true;
      octx.imageSmoothingQuality = 'high';
      octx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, w, h);
      return out.toDataURL('image/png');
    }

    function submitSign() {
      if(submitting || loadingPrevious || loadingData)return;
      const training = document.getElementById('trainingSelect').value;
      const nameSel = document.getElementById('nameSelect');
      const name = nameSel.value;
      if (!training) { setStatus('연수를 선택해 주세요.', 'error'); return; }
      if (!name) { setStatus('이름을 선택해 주세요.', 'error'); return; }
      if (!hasStroke) { setStatus('서명을 입력해 주세요.', 'error'); return; }

      const opt = nameSel.selectedOptions[0];
      const row = opt ? Number(opt.dataset.row) : null;
      const signCol = opt ? Number(opt.dataset.signCol) : null;
      const hadPrevious = opt ? opt.dataset.done === '1' : false;
      if (!row || !signCol) {setStatus('명단에서 이름을 다시 선택해 주세요.','error');return;}
      if(hadPrevious && !confirm('이미 저장된 서명을 새 서명으로 바꿀까요?'))return;
      const width = signCol ? regDims.colWidths[signCol] : null;
      const height = regDims.rowHeight || null;

      submitting=true;lockForm(true);document.getElementById('signSubmit').textContent='저장 중…';
      setStatus('저장 중...', 'info');
      window.callApi('submitSignature', training, name, exportSignaturePng(width, height), row, signCol, hadPrevious, width, height)
        .then(function () {
          submitting=false;lockForm(false);clearPad();document.getElementById('signSubmit').textContent='서명 완료';
          setStatus('서명이 저장되었습니다', 'success', 2000);
          // 서버를 다시 조회하지 않고, 방금 서명한 사람만 화면에서 바로 "완료"로 표시
          if (opt) {
            opt.dataset.done = '1';
            opt.textContent = name + ' (서명완료)';
          }
          const person = allNames.find(function (n) { return n.row === row && n.signCol === signCol; });
          if (person) person.done = true;
        })
        .catch(function (err) { submitting=false;lockForm(false);document.getElementById('signSubmit').textContent='다시 저장';setStatus('오류: ' + err.message, 'error'); });
    }
    resizeCanvas();
    loadTrainingList();
  </script>
</body>
</html>
